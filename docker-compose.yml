services:
  # App Backend (Go)
  api:
    build:
      context: .
      target: dev
    container_name: vault_backend
    ports:
      - "8080:8080"
    volumes:
      - .:/app
    networks:
      - vault_network
    env_file:
      - .env
    depends_on:
      - redis
      - mysql
    restart: always


  # MySQL Service
  mysql:
    image: mysql:8.0
    container_name: vault_mysql
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-Hanoi_1234}
      MYSQL_DATABASE: ${DB_NAME:-gamelog}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - vault_network
    restart: always

  # Redis Service
  redis:
    image: redis:7.2-alpine 
    container_name: gamebox
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    networks:
      - vault_network
    restart: always

  #ui cho reddis nhưng tự tìm phiên bản phù hợp đên khi chạy được
  redisinsight:
    image: redis/redisinsight:2.46
    container_name: redis_ui
    user: root
    ports:
      - "8888:8001"
    networks:
      - vault_network
    environment:
      - REDISINSIGHT_HOST=0.0.0.0
      - REDISINSIGHT_PORT=8001
    depends_on:
      - redis

networks:
  vault_network:
    driver: bridge

volumes:
  redis_data:
  mysql_data: